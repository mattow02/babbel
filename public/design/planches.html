<!doctype html>
<meta charset="utf-8">
<title>Babel — planches de design</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14100d; color: #e8dcc8;
         font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; }
  header { padding: 48px clamp(20px, 5vw, 72px) 8px; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 8px; letter-spacing: -.02em; }
  p.chapo { max-width: 62ch; color: #a99a82; margin: 0; }
  .planches { display: grid; gap: 40px; padding: 32px clamp(20px, 5vw, 72px) 72px;
              grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
  figure { margin: 0; }
  figcaption { margin-top: 12px; }
  .titre { font-weight: 600; }
  .note { color: #a99a82; font-size: 14px; }
  svg { width: 100%; height: auto; display: block; border-radius: 10px; }
</style>
<header>
  <h1>Babel, planches de design</h1>
  <p class="chapo">Quatre propositions dessinées, deux dedans, deux dehors. Rien n'est codé :
  ce sont des intentions à valider avant de toucher au moteur.</p>
</header>
<div class="planches">

<figure>
<svg viewBox="0 0 800 500" role="img" aria-label="La galerie hexagonale vue de son axe">
  <defs>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f22"/><stop offset="1" stop-color="#15100b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffcc78" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a07"/><stop offset="1" stop-color="#221a12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0b0806"/>
  <!-- Les six pans : on voit que la salle est un hexagone, ce que la 3D ne montre jamais -->
  <polygon points="0,60 190,120 190,380 0,440" fill="url(#mur)"/>
  <polygon points="800,60 610,120 610,380 800,440" fill="url(#mur)"/>
  <polygon points="190,120 330,155 330,345 190,380" fill="#2e2419"/>
  <polygon points="610,120 470,155 470,345 610,380" fill="#2e2419"/>
  <rect x="330" y="155" width="140" height="190" fill="#100c08"/>
  <!-- Le couloir au fond, et la lueur de la galerie suivante -->
  <rect x="360" y="200" width="80" height="145" fill="#070504"/>
  <ellipse cx="400" cy="250" rx="46" ry="40" fill="url(#halo)" opacity=".5"/>
  <!-- Les rayonnages : cinq etageres, dos de valeurs franchement differentes -->
  <g>
    <g id="rangee">
      <rect x="0" y="0" width="6" height="26" fill="#c9ae7c"/><rect x="7" y="2" width="5" height="24" fill="#4a3a2a"/>
      <rect x="13" y="0" width="7" height="26" fill="#8a6f47"/><rect x="21" y="4" width="4" height="22" fill="#2a2119"/>
      <rect x="26" y="1" width="6" height="25" fill="#e0cb9d"/><rect x="33" y="3" width="5" height="23" fill="#6b5334"/>
      <rect x="39" y="0" width="4" height="26" fill="#3a2e21"/><rect x="44" y="2" width="7" height="24" fill="#a98a5c"/>
    </g>
    <g fill="none">
      <use href="#rangee" x="18" y="150"/><use href="#rangee" x="70" y="150"/><use href="#rangee" x="122" y="150"/>
      <use href="#rangee" x="18" y="196"/><use href="#rangee" x="70" y="196"/><use href="#rangee" x="122" y="196"/>
      <use href="#rangee" x="18" y="242"/><use href="#rangee" x="70" y="242"/><use href="#rangee" x="122" y="242"/>
      <use href="#rangee" x="18" y="288"/><use href="#rangee" x="70" y="288"/><use href="#rangee" x="122" y="288"/>
      <use href="#rangee" x="640" y="150"/><use href="#rangee" x="692" y="150"/><use href="#rangee" x="744" y="150"/>
      <use href="#rangee" x="640" y="196"/><use href="#rangee" x="692" y="196"/><use href="#rangee" x="744" y="196"/>
      <use href="#rangee" x="640" y="242"/><use href="#rangee" x="692" y="242"/><use href="#rangee" x="744" y="242"/>
      <use href="#rangee" x="640" y="288"/><use href="#rangee" x="692" y="288"/><use href="#rangee" x="744" y="288"/>
    </g>
    <g fill="#0f0b08">
      <rect x="0" y="176" width="180" height="5"/><rect x="0" y="222" width="180" height="5"/>
      <rect x="0" y="268" width="180" height="5"/><rect x="0" y="314" width="180" height="5"/>
      <rect x="620" y="176" width="180" height="5"/><rect x="620" y="222" width="180" height="5"/>
      <rect x="620" y="268" width="180" height="5"/><rect x="620" y="314" width="180" height="5"/>
    </g>
  </g>
  <!-- La lampe, au point de fuite, avec son halo : c'est elle qui tient l'image -->
  <ellipse cx="400" cy="118" rx="150" ry="120" fill="url(#halo)"/>
  <circle cx="400" cy="112" r="21" fill="#fff3d4"/>
  <circle cx="400" cy="112" r="21" fill="none" stroke="#17110d" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="91" stroke="#2a2119" stroke-width="2"/>
  <!-- Le sol, sombre, avec le seul reflet de la lampe -->
  <rect y="380" width="800" height="120" fill="url(#solg)"/>
  <ellipse cx="400" cy="440" rx="90" ry="26" fill="#ffcc78" opacity=".10"/>
  <rect y="380" width="800" height="2" fill="#17110d"/>
</svg>
<figcaption><span class="titre">A · La galerie</span><br>
<span class="note">L'hexagone se lit enfin : six pans, deux libres. La lampe est au point de
fuite et tient toute l'image. Dos de livres à valeurs franchement contrastées, sol presque noir
avec le seul reflet de la lampe.</span></figcaption>
</figure>

<figure>
<svg viewBox="0 0 800 500" role="img" aria-label="Le zaguan, sa tremie et son miroir">
  <defs>
    <linearGradient id="puits" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#0d0906"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="50%">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#0a0806"/>
  <polygon points="0,40 250,110 250,390 0,460" fill="#33281c"/>
  <polygon points="800,40 550,110 550,390 800,460" fill="#241c14"/>
  <rect x="250" y="110" width="300" height="280" fill="#2b2217"/>
  <!-- La tremie : le sol s'ouvre, le puits s'abime -->
  <rect x="300" y="330" width="200" height="170" fill="url(#puits)"/>
  <rect x="300" y="330" width="200" height="4" fill="#17110d"/>
  <!-- L'escalier en colimacon qui traverse -->
  <g fill="#1b1510" stroke="#0d0a07" stroke-width="1.5">
    <rect x="382" y="86" width="36" height="330"/>
    <polygon points="330,120 470,132 470,146 330,134"/>
    <polygon points="470,160 330,172 330,186 470,174"/>
    <polygon points="330,200 470,212 470,226 330,214"/>
    <polygon points="470,240 330,252 330,266 470,254"/>
    <polygon points="330,280 470,292 470,306 330,294"/>
    <polygon points="470,320 330,332 330,346 470,334"/>
    <polygon points="330,360 470,372 470,386 330,374"/>
  </g>
  <!-- Le miroir de Borges, sur le cote : une plaque froide dans une piece chaude -->
  <g>
    <rect x="590" y="150" width="118" height="196" rx="3" fill="#1d1710"/>
    <rect x="598" y="158" width="102" height="180" rx="2" fill="#5c6a72"/>
    <polygon points="598,338 700,158 700,200 632,338" fill="#7d8a94" opacity=".55"/>
    <rect x="590" y="150" width="118" height="196" rx="3" fill="none" stroke="#17110d" stroke-width="2.5"/>
  </g>
  <ellipse cx="400" cy="70" rx="130" ry="90" fill="url(#halo2)" opacity=".8"/>
  <circle cx="400" cy="66" r="16" fill="#fff3d4"/>
  <figcaption></figcaption>
</svg>
<figcaption><span class="titre">B · Le zaguán</span><br>
<span class="note">La trémie donne le vertige : le sol s'ouvre, l'escalier s'abîme et s'élève.
Le miroir de la nouvelle est là, sur le côté, froid dans une pièce chaude.</span></figcaption>
</figure>

<figure>
<svg viewBox="0 0 800 500" role="img" aria-label="La bibliotheque vue du dehors, au couchant">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a4a"/><stop offset=".55" stop-color="#7d8a7a"/>
      <stop offset=".8" stop-color="#e0b177"/><stop offset="1" stop-color="#f2c98d"/>
    </linearGradient>
    <linearGradient id="pierre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4e3c0"/><stop offset=".5" stop-color="#e2cda3"/>
      <stop offset="1" stop-color="#b99f76"/>
    </linearGradient>
    <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b48f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6d6350" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ciel)"/>
  <circle cx="400" cy="250" r="52" fill="#fff2d0" opacity=".55"/>
  <!-- Montagnes en plans successifs : la perspective atmospherique -->
  <polygon points="-20,330 120,236 250,330" fill="#9aa294" opacity=".55"/>
  <polygon points="560,330 700,228 830,330" fill="#9aa294" opacity=".55"/>
  <polygon points="120,340 260,262 400,340" fill="#8d9384" opacity=".7"/>
  <polygon points="420,340 560,254 700,340" fill="#8d9384" opacity=".7"/>
  <!-- Le monument : dome, colonnade, volee de marches -->
  <ellipse cx="400" cy="330" rx="230" ry="26" fill="#c9b48d"/>
  <path d="M270 300 A130 118 0 0 1 530 300 Z" fill="url(#pierre)"/>
  <path d="M270 300 A130 118 0 0 1 530 300" fill="none" stroke="#8f7a56" stroke-width="2"/>
  <g fill="#efdfbc" stroke="#a68d66" stroke-width="1.5">
    <rect x="286" y="248" width="17" height="82"/><rect x="318" y="240" width="17" height="90"/>
    <rect x="350" y="235" width="17" height="95"/><rect x="433" y="235" width="17" height="95"/>
    <rect x="465" y="240" width="17" height="90"/><rect x="497" y="248" width="17" height="82"/>
  </g>
  <rect x="278" y="224" width="244" height="16" fill="#e8d6b0" stroke="#a68d66"/>
  <rect x="374" y="248" width="52" height="82" fill="#1c150e"/>
  <path d="M374 258 A26 26 0 0 1 426 258" fill="#1c150e"/>
  <!-- Les cypres, en repetition serielle -->
  <g fill="#33402f">
    <ellipse cx="250" cy="316" rx="6" ry="24"/><ellipse cx="268" cy="318" rx="6" ry="21"/>
    <ellipse cx="286" cy="320" rx="5" ry="18"/><ellipse cx="514" cy="320" rx="5" ry="18"/>
    <ellipse cx="532" cy="318" rx="6" ry="21"/><ellipse cx="550" cy="316" rx="6" ry="24"/>
  </g>
  <!-- La volee de marches, frontale -->
  <g fill="#e6d3ac" stroke="#b39a70" stroke-width="1">
    <rect x="352" y="330" width="96" height="9"/><rect x="345" y="339" width="110" height="9"/>
    <rect x="338" y="348" width="124" height="9"/><rect x="331" y="357" width="138" height="9"/>
    <rect x="324" y="366" width="152" height="9"/>
  </g>
  <!-- Le bassin : c'est lui qui double le monument -->
  <rect y="375" width="800" height="125" fill="#5f5947"/>
  <rect y="375" width="800" height="125" fill="url(#eau)"/>
  <g opacity=".28" transform="translate(0,750) scale(1,-1)">
    <path d="M270 300 A130 118 0 0 1 530 300 Z" fill="#e2cda3"/>
    <rect x="374" y="248" width="52" height="82" fill="#1c150e"/>
  </g>
  <rect y="373" width="800" height="2" fill="#8d7f63"/>
</svg>
<figcaption><span class="titre">C · Le Seuil, au couchant</span><br>
<span class="note">Colonnade, entablement et volée de marches : le détail qui manque au rendu
actuel. Le bassin double le monument, les montagnes s'effacent par plans successifs.</span></figcaption>
</figure>

<figure>
<svg viewBox="0 0 800 500" role="img" aria-label="Le portail, en contre-plongee">
  <defs>
    <linearGradient id="ciel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2b3d"/><stop offset="1" stop-color="#5f7f86"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7c5c"/><stop offset=".35" stop-color="#f2e2bf"/>
      <stop offset="1" stop-color="#a38c66"/>
    </linearGradient>
    <radialGradient id="dedans" cx="50%" cy="30%">
      <stop offset="0" stop-color="#ffcc7d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2a1d10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ciel2)"/>
  <!-- Contre-plongee : les colonnes fuient vers le haut, l'echelle ecrase -->
  <polygon points="120,500 168,90 236,96 214,500" fill="url(#col)"/>
  <polygon points="680,500 632,90 564,96 586,500" fill="url(#col)"/>
  <polygon points="236,96 564,96 586,500 214,500" fill="#d9c49c"/>
  <polygon points="168,90 632,90 620,52 180,52" fill="#f0e0bd"/>
  <polygon points="180,52 620,52 606,26 194,26" fill="#c9b28a"/>
  <!-- L'ouverture unique, et ce qu'on devine dedans -->
  <path d="M330 500 L330 210 A70 70 0 0 1 470 210 L470 500 Z" fill="#140e08"/>
  <path d="M330 500 L330 210 A70 70 0 0 1 470 210 L470 500 Z" fill="url(#dedans)"/>
  <path d="M330 500 L330 210 A70 70 0 0 1 470 210 L470 500" fill="none" stroke="#7d6a4c" stroke-width="3"/>
  <!-- Une silhouette : l'echelle ne se lit que par elle -->
  <g fill="#241a10" opacity=".92">
    <ellipse cx="400" cy="404" rx="9" ry="11"/>
    <path d="M391 416 h18 l4 62 h-8 l-3 -34 -3 34 h-8 z"/>
  </g>
  <g fill="#0f0a06" opacity=".5">
    <rect x="214" y="470" width="372" height="30"/>
  </g>
</svg>
<figcaption><span class="titre">D · Le portail</span><br>
<span class="note">Contre-plongée franche, une seule ouverture, une silhouette pour donner
l'échelle. On ne voit pas la bibliothèque : on voit qu'elle est immense.</span></figcaption>
</figure>

</div>
