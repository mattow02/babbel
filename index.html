<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="La Bibliothèque de Babel de Borges, visitable en 3D. Chaque page est calculée par votre navigateur, aucune n'est stockée."
    />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="La Bibliothèque de Babel" />
    <meta
      property="og:description"
      content="Toutes les pages possibles de quatre-vingts caractères sur quarante lignes. Rien n'est stocké : tout est calculé."
    />
    <title>La Bibliothèque de Babel</title>
  </head>
  <body>
    <main id="root"></main>
    <noscript>
      <div style="max-width:46ch;margin:12vh auto;padding:0 1.5rem;color:#e8dcc8;font:16px/1.6 ui-serif,Georgia,serif">
        <h1 style="font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 1.2rem">
          La Bibliothèque de Babel
        </h1>
        <p style="margin:0 0 1rem">
          Ce site calcule chaque page dans votre navigateur&nbsp;: rien n’est stocké, donc rien ne
          peut être servi sans JavaScript. Il n’y a pas de version dégradée possible : la
          bibliothèque <em>est</em> le calcul.
        </p>
        <p style="margin:0;color:#8a7660;font-size:0.9rem">
          Activez JavaScript pour entrer.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
